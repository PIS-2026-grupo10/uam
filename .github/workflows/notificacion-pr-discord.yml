name: Discord - Code Review

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Seleccionar canal de Discord
        id: canal
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          DEVELOP_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAIN_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$BASE_REF" = "develop" ]; then
            echo "webhook=$DEVELOP_WEBHOOK" >> "$GITHUB_OUTPUT"
          elif [ "$BASE_REF" = "main" ]; then
            echo "webhook=$MAIN_WEBHOOK" >> "$GITHUB_OUTPUT"
          else
            echo "Rama destino no contemplada: $BASE_REF"
            exit 1
          fi

      - name: Notificar Pull Request
        env:
          DISCORD_WEBHOOK: ${{ steps.canal.outputs.webhook }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          jq -n \
            --arg content "🔎 **Pull Request para revisión**

          **PR:** #$PR_NUMBER - $PR_TITLE
          **Autor:** @$PR_AUTHOR
          **Ramas:** \`$HEAD_REF\` → \`$BASE_REF\`
          **Enlace:** $PR_URL" \
            '{content: $content}' |
          curl -fsS \
            -H "Content-Type: application/json" \
            -d @- \
            "$DISCORD_WEBHOOK"
