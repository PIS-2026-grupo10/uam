name: Discord - Code Review

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: read

jobs:
  notificar:
    if: >
      (github.event.action == 'opened' && github.event.pull_request.draft == false) ||
      (github.event.action == 'reopened' && github.event.pull_request.draft == false) ||
      github.event.action == 'ready_for_review'

    runs-on: ubuntu-latest

    steps:
      - name: Seleccionar canal de Discord
        id: canal
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          DEVELOP_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAIN_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$BASE_REF" = "develop" ]; then
            echo "webhook=$DEVELOP_WEBHOOK" >> "$GITHUB_OUTPUT"
          elif [ "$BASE_REF" = "main" ]; then
            echo "webhook=$MAIN_WEBHOOK" >> "$GITHUB_OUTPUT"
          else
            echo "Rama destino no contemplada: $BASE_REF"
            exit 1
          fi

      - name: Notificar Pull Request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ steps.canal.outputs.webhook }}

          PR_ACTION: ${{ github.event.action }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_BODY: ${{ github.event.pull_request.body }}

          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REPOSITORY: ${{ github.repository }}

        run: |
          ISSUE_NUMBER=$(printf '%s' "$PR_BODY" \
            | grep -oE '#[0-9]+' \
            | head -1 \
            | tr -d '#' || true)

          if [ -n "$ISSUE_NUMBER" ]; then
            ISSUE_TITLE=$(gh api \
              "/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
              --jq '.title' 2>/dev/null || true)

            if [ -n "$ISSUE_TITLE" ]; then
              ISSUE="[#${ISSUE_NUMBER} - ${ISSUE_TITLE}](https://github.com/${REPOSITORY}/issues/${ISSUE_NUMBER})"
            else
              ISSUE="[#${ISSUE_NUMBER}](https://github.com/${REPOSITORY}/issues/${ISSUE_NUMBER})"
            fi
          else
            ISSUE="No especificado"
          fi

          if [ "$PR_ACTION" = "opened" ]; then
            ESTADO="Abierto"
          elif [ "$PR_ACTION" = "reopened" ]; then
            ESTADO="Reabierto"
          elif [ "$PR_ACTION" = "ready_for_review" ]; then
            ESTADO="Listo para revisión"
          else
            ESTADO="$PR_ACTION"
          fi

          FECHA=$(TZ="America/Montevideo" \
            date -d "$PR_CREATED_AT" '+%d/%m/%Y %H:%M')

          jq -n \
            --arg title "PR #$PR_NUMBER - $PR_TITLE" \
            --arg url "$PR_URL" \
            --arg status "$ESTADO" \
            --arg author "$PR_AUTHOR" \
            --arg issue "$ISSUE" \
            --arg branches "$HEAD_REF → $BASE_REF" \
            --arg date "$FECHA" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                fields: [
                  {
                    name: "Estado",
                    value: $status,
                    inline: false
                  },
                  {
                    name: "Autor",
                    value: $author,
                    inline: false
                  },
                  {
                    name: "Issue asociado",
                    value: $issue,
                    inline: false
                  },
                  {
                    name: "Ramas",
                    value: $branches,
                    inline: false
                  },
                  {
                    name: "Fecha",
                    value: $date,
                    inline: false
                  }
                ]
              }]
            }' > payload.json

          curl \
            --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK"
