name: Validar PR y notificar Code Review

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validar-descripcion-pr:
    name: Validar descripción del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Verificar campos obligatorios e Issue asociado
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            const secciones = [
              "Descripción",
              "Issue asociado",
              "Cambios realizados",
              "Pruebas realizadas",
              "Consideraciones"
            ];

            const faltantes = [];
            const contenidos = {};

            for (let i = 0; i < secciones.length; i++) {
              const actual = secciones[i];

              const inicioRegex = new RegExp(
                `##\\s*${actual}\\s*\\r?\\n`,
                "i"
              );

              const match = inicioRegex.exec(body);

              if (!match) {
                faltantes.push(actual);
                continue;
              }

              const inicioContenido =
                match.index + match[0].length;

              let finContenido = body.length;

              for (const otra of secciones) {
                if (otra === actual) {
                  continue;
                }

                const siguienteRegex = new RegExp(
                  `##\\s*${otra}\\s*\\r?\\n`,
                  "i"
                );

                const siguiente = siguienteRegex.exec(
                  body.substring(inicioContenido)
                );

                if (siguiente) {
                  const posicion =
                    inicioContenido + siguiente.index;

                  if (posicion < finContenido) {
                    finContenido = posicion;
                  }
                }
              }

              let contenido = body
                .substring(inicioContenido, finContenido);

              // Los comentarios HTML del template no cuentan.
              contenido = contenido.replace(
                /<!--[\s\S]*?-->/g,
                ""
              );

              // Las viñetas vacías tampoco cuentan.
              contenido = contenido.replace(
                /^\s*[-*•]\s*$/gm,
                ""
              );

              contenido = contenido.trim();

              contenidos[actual] = contenido;

              if (!contenido) {
                faltantes.push(actual);
              }
            }

            if (faltantes.length > 0) {
              core.setFailed(
                `El Pull Request tiene campos obligatorios sin completar: ${faltantes.join(", ")}`
              );
              return;
            }

            // Validar que la sección "Issue asociado"
            // contenga un número con formato #123.
            const contenidoIssue = contenidos["Issue asociado"];

            const issueMatch = contenidoIssue.match(/#(\d+)/);

            if (!issueMatch) {
              core.setFailed(
                "No se especificó un Issue asociado válido. Debe indicarse con el formato #número."
              );
              return;
            }

            const issueNumber = Number(issueMatch[1]);

            // Verificar que el Issue realmente exista.
            try {
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });

              // GitHub trata los PR también como Issues en esta API.
              // Evitamos aceptar accidentalmente otro PR como Issue asociado.
              if (response.data.pull_request) {
                core.setFailed(
                  `#${issueNumber} corresponde a un Pull Request y no a un Issue.`
                );
                return;
              }

              console.log(
                `Issue asociado válido: #${issueNumber} - ${response.data.title}`
              );

            } catch (error) {
              if (error.status === 404) {
                core.setFailed(
                  `El Issue asociado #${issueNumber} no existe en este repositorio.`
                );
                return;
              }

              throw error;
            }

            console.log(
              "Todas las secciones obligatorias están completas y el Issue asociado es válido."
            );

  notificar:
    name: Notificar Code Review
    needs: validar-descripcion-pr

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (
        github.event.action == 'opened' ||
        github.event.action == 'edited' ||
        github.event.action == 'reopened' ||
        github.event.action == 'ready_for_review'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Verificar si el PR ya fue notificado
        id: verificar-notificacion
        uses: actions/github-script@v8
        with:
          script: |
            const labels = context.payload.pull_request.labels
              .map(label => label.name);

            const yaNotificado =
              labels.includes("code-review-notificado");

            core.setOutput(
              "ya_notificado",
              yaNotificado ? "true" : "false"
            );

            if (yaNotificado) {
              console.log(
                "El Pull Request ya fue notificado para Code Review."
              );
            } else {
              console.log(
                "El Pull Request todavía no fue notificado."
              );
            }

      - name: Seleccionar canal de Discord
        if: steps.verificar-notificacion.outputs.ya_notificado == 'false'
        id: canal
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          DEVELOP_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAIN_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$BASE_REF" = "develop" ]; then
            echo "webhook=$DEVELOP_WEBHOOK" >> "$GITHUB_OUTPUT"
          elif [ "$BASE_REF" = "main" ]; then
            echo "webhook=$MAIN_WEBHOOK" >> "$GITHUB_OUTPUT"
          else
            echo "Rama destino no contemplada: $BASE_REF"
            exit 1
          fi

      - name: Notificar Pull Request
        if: steps.verificar-notificacion.outputs.ya_notificado == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ steps.canal.outputs.webhook }}

          PR_ACTION: ${{ github.event.action }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_BODY: ${{ github.event.pull_request.body }}

          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REPOSITORY: ${{ github.repository }}

        run: |
          ISSUE_NUMBER=$(printf '%s' "$PR_BODY" \
            | sed -n '/##[[:space:]]*Issue asociado/,/##/p' \
            | grep -oE '#[0-9]+' \
            | head -1 \
            | tr -d '#')

          ISSUE_TITLE=$(gh api \
            "/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '.title')

          ISSUE="[#${ISSUE_NUMBER} - ${ISSUE_TITLE}](https://github.com/${REPOSITORY}/issues/${ISSUE_NUMBER})"

          if [ "$PR_ACTION" = "opened" ]; then
            ESTADO="Abierto"
          elif [ "$PR_ACTION" = "reopened" ]; then
            ESTADO="Reabierto"
          elif [ "$PR_ACTION" = "ready_for_review" ]; then
            ESTADO="Listo para revisión"
          elif [ "$PR_ACTION" = "edited" ]; then
            ESTADO="Listo para revisión"
          else
            ESTADO="$PR_ACTION"
          fi

          FECHA=$(TZ="America/Montevideo" \
            date -d "$PR_CREATED_AT" '+%d/%m/%Y %H:%M')

          jq -n \
            --arg title "PR #$PR_NUMBER - $PR_TITLE" \
            --arg url "$PR_URL" \
            --arg status "$ESTADO" \
            --arg author "$PR_AUTHOR" \
            --arg issue "$ISSUE" \
            --arg branches "$HEAD_REF → $BASE_REF" \
            --arg date "$FECHA" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                fields: [
                  {
                    name: "Estado",
                    value: $status,
                    inline: false
                  },
                  {
                    name: "Autor",
                    value: $author,
                    inline: false
                  },
                  {
                    name: "Issue asociado",
                    value: $issue,
                    inline: false
                  },
                  {
                    name: "Ramas",
                    value: $branches,
                    inline: false
                  },
                  {
                    name: "Fecha",
                    value: $date,
                    inline: false
                  }
                ]
              }]
            }' > payload.json

          curl \
            --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK"

      - name: Marcar PR como notificado
        if: steps.verificar-notificacion.outputs.ya_notificado == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            const labelName = "code-review-notificado";

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  description: "El PR ya fue notificado en el canal de Code Review"
                });
              } else {
                throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [labelName]
            });

            console.log(
              "Pull Request marcado como notificado."
            );
