      - name: Notificar Pull Request
        env:
          DISCORD_WEBHOOK: ${{ steps.canal.outputs.webhook }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          # Buscar el primer issue mencionado como #123 en el cuerpo del PR
          ISSUE=$(printf '%s' "$PR_BODY" | grep -oE '#[0-9]+' | head -1 || true)

          if [ -z "$ISSUE" ]; then
            ISSUE="No especificado"
          fi

          # Formatear fecha
          FECHA=$(date -d "$PR_CREATED_AT" '+%d/%m/%Y %H:%M UTC')

          jq -n \
            --arg title "PR #$PR_NUMBER — $PR_TITLE" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            --arg issue "$ISSUE" \
            --arg branches "\`$HEAD_REF\` → \`$BASE_REF\`" \
            --arg date "$FECHA" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                fields: [
                  {
                    name: "Autor",
                    value: $author,
                    inline: true
                  },
                  {
                    name: "Issue asociado",
                    value: $issue,
                    inline: true
                  },
                  {
                    name: "Ramas",
                    value: $branches,
                    inline: false
                  },
                  {
                    name: "Creado",
                    value: $date,
                    inline: true
                  }
                ],
                footer: {
                  text: "PIS 2026 · Grupo 10 · Revisión de código"
                }
              }]
            }' |
          curl -fsS \
            -H "Content-Type: application/json" \
            -d @- \
            "$DISCORD_WEBHOOK"
